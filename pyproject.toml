[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offside-detect"
version = "0.2.0"
description = "Bird's-eye offside analysis prototype for fixed-camera football video"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.scripts]
offside-detect = "offside_detect.cli:main"
offside-web = "offside_detect.web:main"

[tool.setuptools.package-data]
offside_detect = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
